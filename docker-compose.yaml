version: '3.8'

services:
  # MPC Arbitrage Bot (Multi-Pair)
  arbitrage-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: arbitrage-bot
    restart: unless-stopped
    ports:
      # BIND_IP erlaubt die Wahl zwischen Produktion (192.168.113.14) und
      # Dev-Host. Default ist die Produktions-IP -> Verhalten unveraendert.
      # Fuer den Dev-Host wird BIND_IP per .env auf 0.0.0.0 gesetzt.
      - "${BIND_IP:-192.168.113.14}:18888:8505"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      # API-Keys kommen bevorzugt aus ENV (siehe .env / env_file).
      # Leere Werte fallen automatisch auf config.yaml zurueck.
      # Der Key-Loader laedt sie beim Start aus config.yaml in die ENV
      # des Kindprozesses - die Werte werden dabei NIE ausgegeben.
      - KUCOIN_KEY=${KUCOIN_KEY:-}
      - KUCOIN_SECRET=${KUCOIN_SECRET:-}
      - KUCOIN_PASSPHRASE=${KUCOIN_PASSPHRASE:-}
      - MEXC_KEY=${MEXC_KEY:-}
      - MEXC_SECRET=${MEXC_SECRET:-}
    # Der Key-Loader liest config.yaml im Container und legt die Keys in die
    # ENV des Kindprozesses - die Werte werden NIE ausgegeben.
    command: ["python3", "/app/scripts/load_keys_to_env.py", "python", "arb_autotrade.py"]
    healthcheck:
      # WICHTIG (Fix 2026-10-28): wget ist in python:3.11-slim NICHT vorhanden.
      # Der Healthcheck "CMD wget ..." schlug deshalb IMMER fehl (exit 127) ->
      # Container dauerhaft unhealthy -> Neustart -> SAFETY-Block setzt
      # enabled=False -> "Bot hat sich abgeschaltet". python ist im Image da.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8505/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: arbitrage-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
      - "${BIND_IP:-192.168.113.14}:${DASHBOARD_PORT2:-8502}:8501"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      # Dashboard liest die Keys ebenfalls aus ENV (mit Fallback auf config.yaml)
      - KUCOIN_KEY=${KUCOIN_KEY:-}
      - KUCOIN_SECRET=${KUCOIN_SECRET:-}
      - KUCOIN_PASSPHRASE=${KUCOIN_PASSPHRASE:-}
      - MEXC_KEY=${MEXC_KEY:-}
      - MEXC_SECRET=${MEXC_SECRET:-}
    healthcheck:
      # Gleiches Problem: wget fehlt im python:3.11-slim -> Healthcheck
      # schlug immer fehl -> Container unhealthy -> Neustart -> Streamlit-
      # Session weg -> Dashboard springt zurueck ins Hauptmenue.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s