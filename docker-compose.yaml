version: '3.8'

services:
  # MPC Arbitrage Bot (Multi-Pair)
  arbitrage-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: arbitrage-bot
    restart: unless-stopped
    ports:
      - "192.168.113.14:18888:8505"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    command: ["python", "arb_autotrade.py"]
    healthcheck:
      # WICHTIG (Fix 2026-10-28): wget ist in python:3.11-slim NICHT vorhanden.
      # Der Healthcheck "CMD wget ..." schlug deshalb IMMER fehl (exit 127) ->
      # Container dauerhaft unhealthy -> Neustart -> SAFETY-Block setzt
      # enabled=False -> "Bot hat sich abgeschaltet". python ist im Image da.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8505/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: arbitrage-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "192.168.113.14:8502:8501"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    healthcheck:
      # Gleiches Problem: wget fehlt im python:3.11-slim -> Healthcheck
      # schlug immer fehl -> Container unhealthy -> Neustart -> Streamlit-
      # Session weg -> Dashboard springt zurueck ins Hauptmenue.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s