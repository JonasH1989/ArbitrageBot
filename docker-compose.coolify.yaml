services:
  # Variante fuer die Coolify-Verwaltung auf CoolifyDev.
  # Unterschiede zum Standard-Compose:
  # - absolute Pfade fuer config/ und logs/ (Coolify klont das Repo in ein
  #   eigenes Arbeitsverzeichnis; relative Pfade zeigten sonst ins Clone)
  # - Bind-IP fest auf 0.0.0.0 (der Default 192.168.113.14 ist im 13er-VLAN
  #   nicht erreichbar)
  arbitrage-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    ports:
      - "0.0.0.0:18888:8505"
    volumes:
      - /opt/arb/ArbitrageBot/config:/app/config
      - /opt/arb/ArbitrageBot/logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    command: ["python3", "/app/scripts/load_keys_to_env.py", "python", "arb_autotrade.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8505/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "0.0.0.0:8501:8501"
      - "0.0.0.0:8502:8501"
    volumes:
      - /opt/arb/ArbitrageBot/config:/app/config
      - /opt/arb/ArbitrageBot/logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    command: ["python3", "/app/scripts/load_keys_to_env.py", "streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
